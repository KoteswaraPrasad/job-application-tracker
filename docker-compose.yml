services:

  # Node.js + Express Backend
  backend:
    image: koteswaraprasad/job-tracker-backend:latest
    container_name: job-tracker-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - job-tracker-network

  # React Frontend served via Nginx
  frontend:
    image: koteswaraprasad/job-tracker-frontend:latest
    container_name: job-tracker-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - job-tracker-network

networks:
  job-tracker-network:
    driver: bridge